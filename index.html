<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Tanvi ❤️</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(-45deg, #ff758c, #ff7eb3, #ffc3a0, #ffdde1);
    background-size: 400% 400%;
    animation: gradient 12s ease infinite;
    font-family: 'Georgia', serif;
    overflow: hidden;
}

@keyframes gradient {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* NAVBAR */
.navbar {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    backdrop-filter: blur(10px);
    background: rgba(255,255,255,0.15);
    padding: 8px 18px;
    border-radius: 30px;
    display: flex;
    gap: 18px;
    z-index: 10;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
}

.navbar a {
    text-decoration: none;
    color: white;
    font-size: 14px;
    opacity: 0.8;
    transition: 0.3s ease;
}

.navbar a.active {
    opacity: 1;
    font-weight: bold;
    text-shadow: 0 0 8px rgba(255,255,255,0.8);
}

/* Glass Card */
.container {
    z-index: 2;
    max-width: 420px;
    width: 90%;
    padding: 35px 25px;
    border-radius: 20px;
    backdrop-filter: blur(14px);
    background: rgba(255, 255, 255, 0.18);
    box-shadow: 0 8px 30px rgba(0,0,0,0.2);
    text-align: center;
}

/* Glow Name */
h1 {
    font-size: clamp(32px, 8vw, 48px);
    margin-bottom: 10px;
    color: white;
    text-shadow:
        0 0 10px rgba(255,255,255,0.8),
        0 0 25px rgba(255,120,160,0.6);
}

.subtitle {
    font-size: clamp(16px, 4vw, 22px);
    margin-bottom: 30px;
    color: white;
}

#countdown {
    font-size: clamp(22px, 5vw, 34px);
    font-weight: bold;
    color: white;
    cursor: pointer;
}

.number {
    display: inline-block;
    animation: softFade 0.6s ease;
}

@keyframes softFade {
    from { opacity: 0.4; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
}

/* Hearts */
.heart {
    position: absolute;
    width: 16px;
    height: 16px;
    animation: float linear forwards;
    opacity: 0.6;
}

@keyframes float {
    0% { transform: translateY(100vh) scale(0.6); opacity:0; }
    20% { opacity:0.6; }
    100% { transform: translateY(-10vh) scale(1.1); opacity:0; }
}
</style>
</head>

<body>

<nav class="navbar">
    <a href="index.html" class="active">Countdown</a>
    <a href="birthday.html">Birthday</a>
</nav>

<div class="container">
    <h1>Tanvi ❤️</h1>
    <div class="subtitle">Counting Every Second</div>
    <div id="countdown"></div>
</div>

<script>
const targetDate = new Date("March 21, 2026 00:00:00").getTime();
const countdownElement = document.getElementById("countdown");

setInterval(() => {
    const now = new Date().getTime();
    const distance = targetDate - now;

    if(distance < 0){
        window.location.href = "birthday.html";
        return;
    }

    const d = Math.floor(distance / (1000*60*60*24));
    const h = Math.floor((distance % (1000*60*60*24)) / (1000*60*60));
    const m = Math.floor((distance % (1000*60*60)) / (1000*60));
    const s = Math.floor((distance % (1000*60)) / 1000);

    countdownElement.innerHTML = `
        <span class="number">${d}</span>d 
        <span class="number">${h}</span>h 
        <span class="number">${m}</span>m 
        <span class="number">${s}</span>s
    `;
}, 1000);

function createHeart(){
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.style.left = Math.random()*100 + "vw";
    heart.style.animationDuration = (Math.random()*6 + 8) + "s";
    heart.innerHTML = `<svg viewBox="0 0 24 24" width="100%" height="100%">
    <path fill="#ffffffcc" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5
    2 6 4 4 6.5 4c1.74 0 3.41 1.01 4.22 2.56
    C11.09 5.01 12.76 4 14.5 4
    17 4 19 6 19 8.5
    c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`;
    document.body.appendChild(heart);
    setTimeout(()=> heart.remove(), 12000);
}
setInterval(createHeart, 900);
</script>

</body>
</html>
